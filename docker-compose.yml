services:
  ardupilot-sitl:
    image: ghcr.io/dreadnought-robotics/mira_sim-ardupilot-sitl:latest
    build:
     context: .
     dockerfile: Dockerfile
    platform: linux/amd64
    tty: true
    environment:
      - VEHICLE=ArduSub
      - MODEL=vectored
      - PATH=/usr/local/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ./ardupilot:/ardupilot_data
    network_mode: host
    entrypoint: /bin/bash
    command: >
      -c "
      cd /ardupilot_data && /ardupilot/Tools/autotest/sim_vehicle.py -N -f vectored_6dof -v ArduSub --console --model JSON:127.0.0.1"
  mira_sim:
    image: ghcr.io/dreadnought-robotics/mira_sim-stonefish:latest
    build:
      context: .
      dockerfile: stonefish.Dockerfile
    platform: linux/amd64
    tty: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - $HOME/.Xauthority:/root/.Xauthority:rw
    entrypoint: /bin/bash
