name: Build and Publish Containers

on:
  push:
  pull_request:
    types: [closed]       # Only merged PRs build an image, not every open/sync
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # ArduPilot SITL (vectored_6dof, JSON FDM bridge on 127.0.0.1:9002, QGC on 14550)
          # Dockerfile: docker/ardupilot.Dockerfile, context: repo root (needs docker/ardusub_frame_config.parm)
          - image: ardupilot-sitl
            context: .
            dockerfile: docker/ardupilot.Dockerfile
          # Gazebo Harmonic + ArduPilot bridge plugin + bluerov2_gz models
          # Minimal build-only Dockerfile: docker/gazebo.Dockerfile, context: repo root
          # (needs src/ardupilot_gazebo + src/bluerov2_gz vendored at /workspace)
          # Single image serves both mira_sim (auto-detect) and mira-sim-gpu (nvidia runtime via compose)
          - image: gazebo
            context: .
            dockerfile: docker/gazebo.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
